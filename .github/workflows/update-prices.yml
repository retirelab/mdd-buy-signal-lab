name: Update Price Data

on:
  schedule:
    # 정각을 피해 분 단위를 어긋나게 지정 (Actions 스케줄 혼잡 회피)
    # 01:27 UTC = 한국시간 10:27 (화~토) — 미국 전일 종가 확정 후
    - cron: '27 1 * * 2-6'
    # 04:27 UTC = 한국시간 13:27 (화~토) — 1차 실행이 누락됐을 때를 위한 재시도
    - cron: '27 4 * * 2-6'
  workflow_dispatch:

# 동시 실행 방지 (1차와 재시도가 겹쳐 push 충돌하는 것 방지)
concurrency:
  group: update-price-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade yfinance requests

      - name: Run update script
        run: python scripts/update_prices.py

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 그동안 다른 커밋이 있었을 수 있으므로 rebase 후 push
          git pull --rebase origin ${{ github.ref_name }}
          git push
