name: Update VIX daily (FRED VIXCLS)
on:
  schedule:
    - cron: '25 14 * * 2-6' # 23:25 Asia/Seoul (Tue–Sat), after FRED posts the prior US close
  workflow_dispatch:
  push:
    paths:
      - scripts/update_vix.py
      - .github/workflows/update-vix.yml
concurrency:
  group: update-price-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public FRED VIXCLS CSV without API key
        run: python scripts/update_vix.py
      - name: Commit data and fetch status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro/VIXCLS.json data/macro/VIXCLS-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update VIXCLS and collection status"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
